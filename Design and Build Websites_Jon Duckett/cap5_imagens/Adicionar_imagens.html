<!--
 NB:É uma boa prátca criar uma pasta para todas as imagens que o site vai usar.

 <img src="url" alt="descriçao" title="titulo"/>

 Usamos a tag <img> para adicionar imagens. NB:A tag <img> não tem tag de encerramento(é um elemento vazio). Leva como atributos os seguintes:

src->indica ao navegador onde ele vai encontrar a imagem.Geralmente usa o realtive url.

alt->fornece uma descriçao da imagem caso o navegador nao consiga abrir a imagem.Se a imagem não tiver nenhum significado, só for para estética é aconselhável
deixar as aspas vazias(tem que ver com mecanismos de pesquisa).

title-> fornece informaçao adicional acerca da imagem.É geralmente exibido em forma de tooltip quando o cursor é colocado sobre a imagem

NB:Os primeiros 2 atributos sao obrigatórios.



 -->
