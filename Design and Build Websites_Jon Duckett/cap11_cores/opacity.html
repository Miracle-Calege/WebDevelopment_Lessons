<!DOCTYPE html>
<html>
<head>
    <title>Opacity</title>
    <style type="text/css">
        div {
            width: 100px;
            height: 100px;
            margin: 40px;
            display: inline-block;
            background-color: #ee3e80;}
        p {
            width: 100px;
            height: 100px;
            position: relative;
            top: 20px;
            left: 20px;
            margin: 20px;}
        p.one {
            background-color: rgb(0,0,0);
            opacity: 0.5;}
        p.two {
            background-color: rgb(0,0,0);
            background-color: rgba(0,0,0,0.5);}
    </style>
</head>
<body>
<div><p class="one"></p></div>
<div><p class="two"></p></div>
</body>
</html>

<!--
 opacity-> é a propriedade que permite especificar a opacidade de um elemento e dos seus filhos. O valor varia de 0.0 - 1.0.

 rgba(red,green,blue;opacity)-> permite especificar a cor e a opacidade.NB:Aqui a opacidade só vai afectar o elemento em que foi aplicado e nao os seus filhos.


 -->
