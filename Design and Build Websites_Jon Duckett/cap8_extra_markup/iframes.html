<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<iframe
        src="http://maps.google.co.uk/maps?q=moma+new+york
&amp;output=embed"
        width="450"
        height="350"
        frameborder="0"
        scrolling="no">
</iframe>
</body>
</html>

<!--
 <iframe></iframe> ->é como se fosse uma pequena parte cortada da nossa pagina.Nessa pequena parte cortada podemos ver outra pagina.

 iframe=inline frame

 NB:O <iframe> é usado para imbutir um documento html dentro da nossa pagina/documento html

Podemos ser usado por exemplo para embutir o google maps na página.Leva como atributos: src, height, width.

seamless-> é um atributo usado se nao quisermos que apareçam scrollbar(nao precisamos de dar nenhum valor).
Alguns atributos(arcaicos):

scrolling->adiciona a scrollbar. Pode assumir os valores yes(exibe a scrollbar), no(nao exibe a scrollbar) e auto(exibe se necessario).

frameborder->indica se alguma borda sera exibida 0(nao terá borda) 1 (terá borda)



 -->
