<!--
 <meta>-> é um elemento vazio(nao tem tag de encerramento) que fica dentro do elemento <head>, tem como objectivo fornecer informaçoes da página aos motores de busca(quem criou,etc)

 Atributos:

 name-> é a propriedade a ser definida.Pode assumir os valores;description(usada pelo motores para entender de que a página trata.o content deve ter no máximo 155 caracteres), keywords(o content contem uma lista separada por palavras que o usuário pode procurar e enconmntrar na pagina),robots(determina se os motores vao adicionar a pagina nos resultados de pesquisa ou nao. content pode ter os valores noindex-para nao adicionar e nofollow-para adicionar).

 content-> é a definiçao

http-equiv assume os seguintes valores:
author->define o autor da pagina
pragma->salva os recursos da pagina localmente para que na proxima visita seja mais rapido a carregar
expires->determina a data de validade dos dados guardados

NB:Usamos depois contet para especificar os valores reais para os 3 itens acima


 -->
