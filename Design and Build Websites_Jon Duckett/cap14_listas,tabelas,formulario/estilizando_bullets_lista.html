<!DOCTYPE html>
<html>
<head>
    <title>List Style Type</title>
    <style type="text/css">
        ol {
            list-style-type: lower-roman;}
    </style>
</head>
<body>
<h1>The Complete Poems</h1>
<h2>Emily Dickinson</h2>
<ol>
    <li>Life</li>
    <li>Nature</li>
    <li>Love</li>
    <li>Time and Eternity</li>
    <li>The Single Hound</li>
</ol>
</body>
</html>

<!--
 list-style-type->permite controlar o estilo e formato do bullet/marcador.Pode ser usado <ol>,<ul> e <li>

 Para <ul> temos os seguintes valores:
 none
 disc-> um circulo pintado
 circle-> um circulo com fundo branco
 square->quadrado pintado

  Para <ol> temos os seguintes valores:
 decimal->1,2,3,etc

 decimal-leading-zerp-> 01,02,03,etc

 upper-alpha-A,B,C,etc

 lower-roman-> numeraçao romana em minúsculo.

 upper-roman-> numeraçao romana em maiuscúlo.



 -->
