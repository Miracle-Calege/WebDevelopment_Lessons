<!DOCTYPE html>
<html>

<body>
<p>Movie Reviews:
<ul>
    <li><a href="http://www.empireonline.com">
        Empire</a></li>
    <li><a href="http://www.metacritic.com">
        Metacritic</a></li>
    <li><a href="http://www.rottentomatoes.com">
        Rotten Tomatoes</a></li>
    <li><a href="http://www.variety.com">
        Variety</a></li>
</ul>
</p>
</body>
</html>

<!--
Link->é um mecanismo que permite sair de uma página web para a outra permitindo a navegaçao.

Tipos de links:

Links de uma website para o outro
links de uma página para a outra no mesmo website
links para abrir uma nova janela do browser
links que enviam emails para alguem

*************************************************

<a href="url"></a>-> usamos esta tag para criar links, quando for clicado o conteúdo que estiver entre as tag seremos direcionado para a url specificada pelo atributo href.

O texto entre as tag chama-se link text, é deve ser o mais explícito possível(informando para aonde os usuários serao direccionados)

URL(Uniform Resource locator)

Absolute URL -> sao aqueles que especificamos o nome do dominio da url.

-->
