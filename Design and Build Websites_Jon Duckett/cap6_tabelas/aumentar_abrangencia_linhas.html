<!DOCTYPE html>
<html>

<body>
<table>
    <tr>
        <th></th>
        <th>ABC</th>
        <th>BBC</th>
        <th>CNN</th>
    </tr>
    <tr>
        <th>6pm - 7pm</th>
        <td rowspan="2">Movie</td><!-- O movie vai abrangir 2 linhas 6-7pm e 7-8pm-->
        <td>Comedy</td>
        <td>News</td>
    </tr>
    <tr>
        <th>7pm - 8pm</th>
        <td>Sport</td>
        <td>Current Affairs</td>
    </tr>
</table>


</body>
</html>

<!--
 Usamos o atributo rowspan com os elementos <td> ou <th> para indicar o número de linhas que a célula pode atravessar

 NB:Os valores desse atributo sao numeros.



 -->
