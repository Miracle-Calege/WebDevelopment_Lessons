<!DOCTYPE html>
<html>
<body>
<table border="2" bgcolor="#efefef">
    <tr>
        <th width="150"></th>
        <th>Withdrawn</th>
        <th>Credit</th>
        <th width="150" bgcolor="#cccccc">Balance</th>
    </tr>
    <tr>
        <th>January</th>
        <td>250.00</td>
        <td>660.50</td>
        <td bgcolor="#cccccc">410.50</td>
    </tr>
    <tr>
        <th>February</th>
        <td>135.55</td>
        <td>895.20</td>
        <td bgcolor="#cccccc">1170.15</td>
    </tr>
</table>
</body>
</html>

<!--
 As seguintes abordagens sao arcaicas, actualmente os meus objectivos podem ser alcançados com css:

 border-> era usada tanto na tag <table> quanto na tag <td> para indicar o tamanho da borda em pixels.
 bgcolor->era usado para indicar a cor do background de toda a tabela ou de células individuais. O seu valor é geralmente em código hexadecimal

 -->
