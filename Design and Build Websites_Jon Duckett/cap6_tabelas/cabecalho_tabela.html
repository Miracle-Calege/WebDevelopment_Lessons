<!DOCTYPE html>
<html>

<body>
<table>
    <tr>
        <th></th>
        <th scope="col">Saturday</th>
        <th scope="col">Sunday</th>
    </tr>
    <tr>
    <th scope="row">Tickets sold:</th>
    <td>120</td>
    <td>135</td>
    </tr>
    <tr>
        <th scope="row">Total sales:</th>
        <td>$600</td>
        <td>$675</td>
    </tr>
</table>
</body>
</html>

<!--
 <th></th> ->é usado para representar o cabeçalho. Usa-se do mesmo jeito que o <td>.

 NB:Mesmo se nao tiver conteudo numa celula devemos usar <td> ou <th> para mostrar que e uma celula vazia(sem colcoar conteúdo nela).

 Podemos usar o atributo scope para indicar se o cabeçalho é de coluna(col) ou linha(row).

 -->
