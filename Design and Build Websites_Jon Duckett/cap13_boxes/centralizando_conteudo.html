<!DOCTYPE html>
<html>
<head>
    <title>Centering Content</title>
    <style type="text/css">
        body {
            text-align: center;}
        p {
            width: 300px;
            padding: 50px;
            border: 20px solid #0088dd;}
        p.example {
            margin: 10px auto 10px auto;
            text-align: left;}
    </style>
</head>
<body>
<p>Analog synthesizers are often said to have a "warmer" sound than their digital counterparts.</p>
<p class="example">Analog synthesizers are often said to have a "warmer" sound than their digital counterparts.</p>
</body>
</html>

<!--

NB:Se quisermos centralizar uma box ma página ou centralizá-lo dentro de outra box, devemos colocar margin-left e margin-right com o valor auto isso diz a navegador para colcar um gap igual nos 2 lados.
Para centralizar uma box na página devemos especificar a largura(width) se nao a box vai levar toda a largura da página.



 -->
