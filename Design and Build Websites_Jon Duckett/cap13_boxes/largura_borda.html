<!DOCTYPE html>
<html>
<head>
    <title>Border Width</title>
    <style type="text/css">
        body {
            font-family: Arial, Verdana, sans-serif;
            color: #111111;}
        p {
            width: 200px;
            border-style: solid;}
        p.one {
            border-width: 2px;}
        p.two {
            border-width: thick;}
        p.three {
            border-width: 1px 4px 12px 4px;}/* especificamos 4 valores para os 4 lados. A ordem é top, right, bottom, left:sentido horário*/
    </style>
</head>
<body>
<p class="one">Hohner's "Clavinet" is essentially an electric clavichord.</p>
<p class="two">Hohner's "Clavinet" is essentially an electric clavichord.</p>
<p class="three">Hohner's "Clavinet" is essentially an electric clavichord.</p>
</body>
</html>

<!--
 Toda box tem uma borda(mesmo que nao seja visível ou o seu valor seja 0px).A borda separa o limite de uma box da outra.

border-width-> é usado para controlar a largura de uma borda.O valor pode ser em pixels ou em: thin, medium e thick.NB:Nao usamos percentagens.

Podemos controlar partes individuais da borda:

border-top-width->cima

border-right-width-> lado direito

border-bottom-width-> em baixo

border-left-width-> lado esquerdo


 -->
