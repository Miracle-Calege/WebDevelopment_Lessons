<!DOCTYPE html>
<html>
<head>
    <title>Border Image</title>
    <style type="text/css">
        p {
            width: 197px;
            height: 54px;
            border: 11px solid #ffffff;}
        p.one {
            border-image: url("imagens/rhodes.jpg") 11 11 11 11 stretch;
            border-image: url("imagens/rhodes.jpg") 11 11 11 11 stretch;
            border-image: url("imagens/rhodes.jpg") 11 11 11 11 stretch;}
        p.two {
            border-image: url("imagens/rhodes.jpg") 11 11 11 11 round;
            border-image: url("imagens/rhodes.jpg") 11 11 11 11 round;
            border-image: url("imagens/rhodes.jpg") 11 11 11 11 round;}
    </style>
</head>
<body>
<p class="one"></p>
<p class="two"></p>
</body>
</html>

<!--
 border-image -> aplica uma imagem a borda de uma box.


 Requisitos:

 1.url da imagem
 2.Onde cortar a imagem
 3.Como aplicar a imagem nas bermas:
 Stretch-> estica a imagem
 repeat->repete a imagem
 round->repete a imagem mas se o título nao couber aumenta o seu tamanho.

 NB:A box deve ter uma largura para que a imagem seja exibida.



 -->
