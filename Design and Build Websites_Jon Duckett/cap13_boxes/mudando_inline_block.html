<!DOCTYPE html>
<html>
<head>
    <title>Display</title>
    <style type="text/css">
        body {
            font-family: Arial, Verdana, sans-serif;
            color: #111111;}
        li {
            display: inline;
            margin-right: 10px;}
        li.coming-soon {
            display: none;}
    </style>
</head>
<body>
<ul>
    <li>Home</li>
    <li>Products</li>
    <li class="coming-soon">Services</li>
    <li>About</li>
    <li>Contact</li>
</ul>
</body>
</html>

<!--
 display->permite tornar um elemento inline em block level e vice versa e também para esconder um elemento na página.

 Valores:

 inline->torna um elemento block-level em inline.

 block->torna um elemento inline em block.

 inline-block->torna um block level element em inline mas salva-guardando as outras caracteristicas de block

 none->oculta um elemento da página.

 -->
