<!DOCTYPE html>
<html>
<head>
    <title>Margin</title>
    <style type="text/css">
        body {
            font-family: Arial, Verdana, sans-serif;
            color: #111111;}
        p {
            width: 200px;
            border: 2px solid #0088dd;
            padding: 10px;}
        p.example {
            margin: 20px;}
    </style>
</head>
<body>
<p>Analog synthesizers are often said to have a "warmer" sound than their digital counterparts.</p>
<p class="example">Analog synthesizers are often said to have a "warmer" sound than their digital counterparts.</p>
</body>
</html>

<!--
 margin-> especifica o espaçamento entre boxes.O valor pode ser em pixels(normalmente),percentagem ou ems.

 NB:Se a largura for especificada o valor da margem será adicionada a ela.

 Podemos especificar os valores para cada lado:
margin-top
margin-right
margin-bottom
margin-left

ou usar o atalho:

margin:top,right,botton,left

ou também

margin: 10px(top and bottom) 20 px(left and right)

NB:A margin nao é herdado pelo child elements.

 -->
