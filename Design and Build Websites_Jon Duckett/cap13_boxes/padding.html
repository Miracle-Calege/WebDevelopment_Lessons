<!DOCTYPE html>
<html>
<head>
    <title>Padding</title>
    <style type="text/css">
        body {
            font-family: Arial, Verdana, sans-serif;
            color: #111111;}
        p {
            width: 285px;
            border: 2px solid #0088dd;}
        p.example {
            padding: 10px;}
    </style>
</head>
<body>
<p>Analog synths produce a wave sound, whereas the sounds stored on a digital synth have been sampled and then turned into numbers.</p>
<p class="example">Analog synths produce a wave sound, whereas the sounds stored on a digital synth have been sampled and then turned into numbers.</p>
</body>
</html>

<!--
 Padding-> especifica a quantidade de espaço entre o conteúdo de um elemento e a sua borda.O valor é especificado em pixels(normalmente),percentagem(relativo a janela do browser/elemento que o contem ) ou ems.

 NB:Se a largura é fornecida para a box o padding é adicionado a largura da box.

 Podemos especificar para cada lado:

padding-top
padding-right
padding-bottom
padding-left

ou também usar o atalho:

padding: top,right,bottom,left

ou
padding: 10px(top and bottom), 20px(left and right)

NB:O padding nao é herdado pelo child elements.






 -->
