<!DOCTYPE html>
<html>
<head>
    <title>Visibility</title>
    <style type="text/css">
        body {
            font-family: Arial, Verdana, sans-serif;
            color: #111111;}
        li {
            display: inline;
            margin-right: 10px;}
        li.coming-soon {
            visibility: hidden;}
    </style>
</head>
<body>
<ul>
    <li>Home</li>
    <li>Products</li>
    <li class="coming-soon">Services</li>
    <li>About</li>
    <li>Contact</li>
</ul>
</body>
</html>

<!--
 visibility-> permite ocultar boxes de um usuário(deixa um espaço quando ocultado).

 Os valores podem ser:

 hidden-> oculta o elemento

 visible-> exibe o elemento.

NB: Para que nao seja exibido o espaço em branco devemos usar a propriedade display:none
 -->
