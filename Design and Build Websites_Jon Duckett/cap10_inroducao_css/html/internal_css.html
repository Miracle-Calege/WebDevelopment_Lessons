<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        body {
            font-family: arial;
            background-color: rgb(185,179,175);
        }
        h1 {
            color: rgb(255,255,255);
        }
    </style>

</head>
<body>
<h1>Potatoes</h1>
<p>There are dozens of different potato
    varieties. They are usually described as
    early, second early and maincrop.</p>

</body>
</html>

 <style></style> ->usamos este tag para usar css dentro do ficheiro html sem necessidade de criar um ficheiro css independente.NB:Colocamos este elemento dentro do <head>.

 NB:Esta abordagem é ideal quando só temos uma única página/documento html.
