<!DOCTYPE html>
<html>

<body>
<form action="http://www.example.com/profile.php">
    <p>What device do you listen to music on?</p>
    <select name="devices">
        <option value="ipod">iPod</option>
        <option value="radio">Radio</option>
        <option value="computer">Computer</option>
    </select>
</form>
</body>
</html>

<!--
 <select></select> -> permite nos criar uma drop down list.

 <option></option>->indica as opcoes que o usuário pode selecionar(o texto entre as tag será exibido na lista).

 Atributos:

  name->identifica o nome do controlador sendo mandado para o servidor junto do valor que o usuário selecionou.

   value->indica o valor que será mandado para o servidor quando uma opcao for selecionada.

   selected->seleciona um elemento da lista por definiçao(se nao for especificado o primeiro item da lista será selecionado).

   NB:Só uma única opcao pode ser selecionada





 -->
