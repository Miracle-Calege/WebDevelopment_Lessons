<!DOCTYPE html>
<html>

<body>
<fieldset>
    <legend>Contact details</legend>
    <label>Email:<br />
        <input type="text" name="email" /></label><br />
    <label>Mobile:<br />
        <input type="text" name="mobile" /></label><br />
    <label>Telephone:<br />
        <input type="text" name="telephone" /></label>
</fieldset>
</body>
</html>

<!--
 <fieldset></fieldset> ->usado para agrupar controladores de formulários relacionados.Geralmente os navegadores exibirao o <fieldset> com uma linha em volta

 <legend></legend> ->vem logo depois da tag de abertura <fieldset> que rotula o grupo(identifica o propósito do grupo).

 -->
