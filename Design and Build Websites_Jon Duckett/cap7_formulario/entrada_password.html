<!DOCTYPE html>
<html>

<body>

<form action="http://www.example.com/login.php">
    <p>Username:
        <input type="text" name="username" size="15"
               maxlength="30" />
    </p>
    <p>Password:
        <input type="password" name="password" size="15"
               maxlength="30" />
    </p>
</form>

</body>
</html>

<!--

 Para entrada de password o atributo type recebe o valor de "password" que cria uma de texto de entrada(mas os caracteres sao ocultados).

 name-> colocamos o valor "password" para que servidor saiba que trata-se de password


 size->é uma abordagem arcaica,determina o tamanho do texto a ser inserido(numero de caracteres) tornando a caixa espaçosa o suficiente para que os dados inseridos possam ser exibidos na tela(embora possamos colocar mais caracteres do que o especificado)

 maxlength->limita a quantidade de caracteres que o usuário pode inserir

 -->
