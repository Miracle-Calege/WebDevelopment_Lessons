<!DOCTYPE html>
<html>
<body>
<form action="http://www.example.com/profile.php">
    <p>Please select your favorite genre:
        <br />
        <input type="radio" name="genre" value="rock"
               checked="checked" /> Rock
        <input type="radio" name="genre" value="pop" />
        Pop
        <input type="radio" name="genre" value="jazz" />
        Jazz
    </p>
</form>
</body>
</html>

<!--
 Radio button-> permite que usuários escolham uma de várias opçoes. Para a sua criaçao damos ao atributo type o valor "radio".

 NB:Se tivermos uma questao com varias opcoes convem que o atributo name tenha o mesmo valor para todos as opcoes/radio buttons.

 Atributos:

 value->indica o valor que será mandado para o servidor quando uma opcao for selecionada.

 checked->seleciona uma opcao por definicao. O valor sera "checked"

 NB:Para cada opcao/radio button usamos a tag/elemento <input /> opcao_correspondente. Uma opcao nao pode ser desselecionado.

 -->
