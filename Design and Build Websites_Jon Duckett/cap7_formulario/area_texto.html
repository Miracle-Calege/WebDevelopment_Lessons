<!DOCTYPE html>
<html>

<body>
<form action="http://www.example.com/comments.php">
    <p>What did you think of this gig?</p>
    <textarea name="comments" cols="20" rows="4">Enter
your comments...</textarea>
</form>
</body>
</html>

<!--
 <textarea></textarea> -> é usado para criar multiplas linhas de entrada de texto. Podemos colocar um texto entre as tags para instruir o usuário.

 Embora sejam arcaicos:

 cols-> usado para especificar o numero de colunas

 rows-> usado para especificar o numero de linhas.


 -->
