<!DOCTYPE html>
<html>
<body>
<form action="http://www.example.com/upload.php"
      method="post">
    <p>Upload your song in MP3 format:</p>
    <input type="file" name="user-song" /><br />
    <input type="submit" value="Upload" />
</form>
</body>
</html>

<!--
 Para que possamos fazer upload de um ficheiro devemos dar ao atributo type o valor "file". Este valor cria por defeito uma field que se assemlha a de texto
 e um botao rotulado por browse.Quando clicado o botao abre uma janela que nos permite selecionar ficheiros do computador.

 NB:Quando fizermos uploads de ficheiros o atributo metodo deve ter o valor de post.


 -->
