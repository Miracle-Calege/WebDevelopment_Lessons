<!DOCTYPE html>
<html>

<body>

<form action="http://www.example.com/subscribe.php"
method="get">
<p>This is where the form controls will appear.
</p>
</form>
</body>
</html>


<!--
 <form></form> -> onde colocamos os "controladores" do formulário.Deve ter sempre o atributo action e geralmente os atributos method e id.

 action->toma como valor a url a pagina do servidor que vai receber a informaçao no formulário quando for submetida.

 method-> é a forma como o formulário pode ser mandado, get ou post.

 get-> os valores do formulário sao colocados no final da url especificada no atributo action.

 Quando usar:

 Formulários curtos

 Quando retornamos dados do servidor web


 post->os valores sao mandados em forma de HTTP headers.

  Quando usar:

  Permitir usuários submeterem um ficheiro

  Se o formulario for muito longo

  Se o formulário tiver dados sensíveis

  Para adicionar e eliminar informaçoes da base de dados.

  NB:Se o methdo nao for especificado por defeito será usado o get.

  id-> usado para identifcar o formulário.



 -->
