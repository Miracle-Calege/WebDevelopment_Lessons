<!DOCTYPE html>
<html>
<body>
<form action="http://www.example.com/profile.php">
    <p>Please select your favorite music service(s):
        <br />
        <input type="checkbox" name="service"
               value="itunes" checked="checked" /> iTunes
        <input type="checkbox" name="service"
               value="lastfm" /> Last.fm
        <input type="checkbox" name="service"
               value="spotify" /> Spotify
    </p>
</form>

</body>
</html>

<!--
 checkedbox-> permite que os usuários selecionem e desselecionem uma ou mais opcoes.

 NB:Se tivermos uma questao com varias opcoes convem que o atributo name tenha o mesmo valor para todos as opcoes/checkedbox.

  Atributos:

 value->indica o valor que será mandado para o servidor quando uma opcao for selecionada.

 checked->seleciona uma opcao por definicao. O valor sera "checked"


 -->
