<!DOCTYPE html>
<html>

<body>
<form action="http://www.example.com/subscribe.php">
    <p>Subscribe to our email list:</p>
    <input type="text" name="email" />
    <input type="submit" name="subscribe"
           value="Subscribe" />
</form>
</body>
</html>


<!--
 Se dermos o valor "submit" ao atributo type será criado um botao que nos permitirá enviar o formulário para o servidor.

 value->é usado para determinar o texto que aparece no botao.

 -->
