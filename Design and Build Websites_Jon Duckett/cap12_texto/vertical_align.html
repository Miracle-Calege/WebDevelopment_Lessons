<!DOCTYPE html>
<html>
<head>
    <title>Vertical Align</title>
    <style type="text/css">
        #six-months {
            vertical-align: text-top;}
        #one-year {
            vertical-align: baseline;}
        #two-years {
            vertical-align: text-bottom;}
    </style>
</head>
<body>
<h1>Briard Life Stages</h1>
<p><img src="imagens/six-months.gif" width="50" height="50" alt="Six months" id="six-months" /> Six months</p>
<p><img src="imagens/one-year.gif" width="50" height="50" alt="One year" id="one-year" /> One year</p>
<p><img src="imagens/two-years.gif" width="50" height="50" alt="Two years" id="two-years" /> Two years</p>
</body>
</html>

<!--
vertical-align->é usado para alinhar verticalmente texto.NB:Nao é ideal usar em block level elements.

No codigo a imagem é que está a ser posicionado em relacao ao texto.

valores:
baseline
sub
super
top
text-top
middle
bottom
text-bottom


 -->
