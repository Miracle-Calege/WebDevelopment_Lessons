<body>
<p>It was the <del>worst</del> <ins>best</ins> idea
    she had ever had.</p>
<p>Laptop computer:</p>
<p><s>Was $995</s></p>
<p>Now only $375</p>

<!--
<ins></ins> exibe o elemento inserido no texto.Geralmente é sublinhado.

<del></del> ->exibe o elemento eliminado no texto.Geralmente tem uma linha "cortando" ele.

<s></s>->indica que algo já nao é preciso/relevante.Geralmente tem uma linha "cortando" ele.

-->
