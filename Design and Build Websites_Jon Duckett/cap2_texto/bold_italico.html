
<html>
<body>

<p>This is how we make a word appear <b>bold.</b>
</p>
<p>Inside a product description you might see some
  <b>key features</b> in bold.

</p>
<p>It's a potato <i>Solanum teberosum</i>.</p>
<p>Captain Cook sailed to Australia on the
  <i>Endeavour</i>.</p>
