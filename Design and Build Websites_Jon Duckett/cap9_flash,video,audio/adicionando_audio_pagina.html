<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<audio src="audio/Rick%20Ross%20-%20Family%20Ties%20-%20RickRossVEVO.mp3"
       controls autoplay>
    <p>This browser does not support our audio
        format.</p>
    </audio>
</body>
</html>

<!--

<audio></audio> -> permite-nos adicionar audio ao html

 src-> especifica a localizaçao do audio

 controls-> determina se o reprodutor deve exibir os controladores.Se este atributo nao for especificado nenhum controlador será exibido.

 autoplay->determina se o áudio será reproduzido automaticamente

 preload-> diz ao navegador o que fazer quando o autoplay nao estiver activo.

 none->o navegador nao vai carregar o audio até o usuário pressionar play

auto->o browser deverá baixar o audio quando a pagina carregar

metadata->o navegador deve colectar informaçoes como tamanho, lista de reproducao e duraçao,etc




 -->
