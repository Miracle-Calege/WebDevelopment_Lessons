<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<audio controls autoplay>
    <source src="audio/Rick%20Ross%20-%20Family%20Ties%20-%20RickRossVEVO.mp3" />
    <source src="audio/Rick%20Ross%20-%20Family%20Ties%20-%20RickRossVEVO.ogg" />
    <p>This browser does not support our audio
        format.</p>
    </audio>
</body>
</html>

<!--
 <source /> ->especifica  a localizaçao do audio a ser reproduzido.É usado dentro da tag <audio> subsituindo o src nessa tag.Podemos usar múltiplos <source> para indicar que o audio está disponível em vários formatos.

 Leva os seguintes atributos:

 src-> onde especificamos  a localizaçao

 type->indica o formato do audioo(tipo_ficheiro/formato).NB:Geralmente nao é usado




 -->
