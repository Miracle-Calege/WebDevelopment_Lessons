<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<video poster="imagem/rick.jpeg" width="400"
       height="320" preload controls loop>
    <source src="video/Rick%20Ross%20-%20Family%20Ties.mp4" type='video/
mp4;codecs="avc1.42E01E, mp4a.40.2"' />
    <source src="video/Rick%20Ross%20-%20Family%20Ties.mp4" type='video/
webm;codecs="vp8, vorbis"' />
    <p>A video of a puppy playing in the snow</p>
</video>

</body>
</html>

<!--
 <source /> ->especifica  a localizaçao do vídeo a ser reproduzido.É usado dentro da tag <video> subsituindo o src nessa tag.Podemos usar múltiplos <source> para indicar que o vídeo está disponível em vários formatos.

 Leva os seguintes atributos:

 src-> onde especificamos  a localizaçao

 type->indica o formato do video(tipo_ficheiro/formato).NB: É colocado em aspas simples.

 codecs->é usado para codificar o áudio.É usado no atributo type .


 -->
