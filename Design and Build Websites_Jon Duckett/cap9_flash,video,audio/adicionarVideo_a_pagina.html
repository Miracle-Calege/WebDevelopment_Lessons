<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Adicionado video ao HTML</title>
</head>
<body>
<video src="video/Rick%20Ross%20-%20Family%20Ties.mp4"
poster="imagem/rick.jpeg"
width="400"
height="300"
preload
       controls
       loop
       >
    <p>Rick Ross-family ties</p>
</video>

</body>
</html>

<!--
 <video></video> -> é o elemento que nos permite adicionar videos a página.

 Tem como atributo os seguintes:

 src->que especifica o caminho do vįdeo.

 poster->coloca uma imagem para exibiçao enquanto o video esta sendo baixado/enquanto nao está a ser reproduzido

 width,height-> especifica o tamanho do reprodutor em pixels

 controls->indica que o browser deve fornecer os seus próprios comandos para reproduçao.

 autoplay->indica que o video deve ser reproduzido automaticamente.

 loop->indica que o vídeo vai ficar se repetindo sempre que terminar

 preload-> diz ao navegador o que fazer quando a página carregar. Pode assumir os seguintes valores:

 none->o navegador nao vai carregar o vídeo até o usuário pressionar play

auto->o browser deverá baixar o vídeo quando a pagina carregar

metadata->o navegador deve colectar informaçoes como tamanho, primeiro quadro, lista de reproducao e duraçao.

NB:Os atributos controls,autoplay e loop nao assumem nenhum valor a sua presença indica que estao em funcionamento e a sua ausência o contrário.



 -->
